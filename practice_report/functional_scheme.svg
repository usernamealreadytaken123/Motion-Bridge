<rect width="100%" height="100%" fill="white"/>
<text x="900.0" y="48" font-family="Times New Roman,serif" font-size="39" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Функциональная схема программного комплекса</text>
<polyline points="30,280 1160,280 1160,1110 30,1110 30,280" fill="none" stroke="black" stroke-width="2"/>
<polyline points="1240,280 1770,280 1770,1110 1240,1110 1240,280" fill="none" stroke="black" stroke-width="2"/>
<text x="595" y="309" font-family="Times New Roman,serif" font-size="30" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Android-приложение</text>
<text x="1505" y="309" font-family="Times New Roman,serif" font-size="30" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Приложение для ПК</text>
<polyline points="420,130 730,130 730,240 420,240 420,130" fill="none" stroke="black" stroke-width="2" stroke-dasharray="11 9"/>
<text x="575.0" y="167.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">iPhone: LiDAR</text>
<text x="575.0" y="202.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">phyphox (опционально)</text>
<polyline points="70,350 330,350 330,480 70,480 70,350" fill="none" stroke="black" stroke-width="2"/>
<text x="200.0" y="380.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Датчики Android:</text>
<text x="200.0" y="415.0" font-family="Times New Roman,serif" font-size="24" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ориентация, гироскоп,</text>
<text x="200.0" y="450.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">линейное ускорение</text>
<polyline points="420,350 730,350 730,480 420,480 420,350" fill="none" stroke="black" stroke-width="2"/>
<text x="575.0" y="380.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Сбор данных датчиков</text>
<text x="575.0" y="415.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">и обработка</text>
<text x="575.0" y="450.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ориентации</text>
<polyline points="70,590 330,590 330,720 70,720 70,590" fill="none" stroke="black" stroke-width="2"/>
<text x="200.0" y="637.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Камера Android</text>
<text x="200.0" y="672.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Видеокадры</text>
<polyline points="420,575 730,575 730,745 420,745 420,575" fill="none" stroke="black" stroke-width="2"/>
<text x="575.0" y="607.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Камерная 2D-одометрия</text>
<text x="575.0" y="642.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Компенсация наклона</text>
<text x="575.0" y="677.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">и учёт высоты</text>
<text x="575.0" y="712.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Координаты X, Y</text>
<polyline points="70,845 330,845 330,955 70,955 70,845" fill="none" stroke="black" stroke-width="2"/>
<text x="200.0" y="882.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Ручной ввод</text>
<text x="200.0" y="917.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">высоты камеры</text>
<polyline points="420,845 730,845 730,975 420,975 420,845" fill="none" stroke="black" stroke-width="2" stroke-dasharray="11 9"/>
<text x="575.0" y="875.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Получение глубины</text>
<text x="575.0" y="910.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">и времени измерения</text>
<text x="575.0" y="945.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">от phyphox</text>
<polyline points="840,555 1120,555 1120,760 840,760 840,555" fill="none" stroke="black" stroke-width="2"/>
<text x="980.0" y="605.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Формирование</text>
<text x="980.0" y="640.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">JSON-пакетов:</text>
<text x="980.0" y="675.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">данные датчиков,</text>
<text x="980.0" y="710.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">ориентация и X, Y</text>
<polyline points="1290,350 1720,350 1720,495 1290,495 1290,350" fill="none" stroke="black" stroke-width="2"/>
<text x="1505.0" y="387.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Визуализация:</text>
<text x="1505.0" y="422.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">3D-ориентация, 2D-траектория,</text>
<text x="1505.0" y="457.5" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">графики датчиков</text>
<polyline points="1290,555 1720,555 1720,705 1290,705 1290,555" fill="none" stroke="black" stroke-width="2"/>
<text x="1505.0" y="595.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Приём UDP-пакетов</text>
<text x="1505.0" y="630.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Проверка и разбор данных</text>
<text x="1505.0" y="665.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Контроль состояния связи</text>
<polyline points="1290,805 1720,805 1720,910 1290,910 1290,805" fill="none" stroke="black" stroke-width="2"/>
<text x="1505.0" y="840.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Запись измерений</text>
<text x="1505.0" y="875.0" font-family="Times New Roman,serif" font-size="27" font-weight="normal" text-anchor="middle" dominant-baseline="middle">в файл JSONL</text>
