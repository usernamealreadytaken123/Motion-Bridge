<polygon points="1270,1010 1255.0,1017.0 1255.0,1003.0" fill="black"/>
<polyline points="1485,240 1485,350" fill="none" stroke="black" stroke-width="2"/>
<polygon points="1485,350 1478.0,335.0 1492.0,335.0" fill="black"/>
<polyline points="1485,490 1485,730" fill="none" stroke="black" stroke-width="2"/>
<polygon points="1485,730 1478.0,715.0 1492.0,715.0" fill="black"/>
<rect x="1353.5" y="597.0" width="263.0" height="25.5" fill="white"/>
<text x="1485" y="607" font-family="Times New Roman,serif" font-size="23" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Координаты и траектория</text>
<text x="900" y="1148" font-family="Times New Roman,serif" font-size="24" font-weight="normal" text-anchor="middle" dominant-baseline="middle">Пунктиром обозначен дополнительный источник измерений высоты.</text>
