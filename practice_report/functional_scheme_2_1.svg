<rect x="711.0" y="764.0" width="48.0" height="20.0" fill="white"/>
<text x="735" y="774" font-family="Times New Roman,serif" font-size="22" font-weight="normal" text-anchor="middle" dominant-baseline="middle">TCP</text>
<polyline points="210,860 210,1010 820,1010" fill="none" stroke="black" stroke-width="2"/>
<polygon points="820,1010 805.0,1017.0 805.0,1003.0" fill="black"/>
<rect x="719.0" y="979.0" width="52.0" height="20.0" fill="white"/>
<text x="745" y="989" font-family="Times New Roman,serif" font-size="22" font-weight="normal" text-anchor="middle" dominant-baseline="middle">UDP</text>
<polyline points="1150,795 1270,795" fill="none" stroke="black" stroke-width="2"/>
<polygon points="1270,795 1255.0,802.0 1255.0,788.0" fill="black"/>
